<!doctype html>
<!-- Hero style f-collage. Photos in ../img were generated through gateway.respan.ai (seedream-5.0-flash). -->
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1600px; height: 760px; overflow: hidden; background: #000; }
  body { position: relative; color: #f9fafc; -webkit-font-smoothing: antialiased;
    font: 15px/1.35 Inter, -apple-system, "SF Pro Text", "Segoe UI", Helvetica, sans-serif; }
  .mono { font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace; }
  .card { position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%); width: 1100px; z-index: 5;
    background: rgba(9, 9, 14, .97); border-radius: 22px; overflow: hidden;
    box-shadow: 0 0 0 1px rgba(255,255,255,.09), 0 50px 120px 10px #000, 0 20px 40px -20px rgba(0,0,0,.6); }
  .bar { position: relative; height: 70px; display: flex; align-items: center; padding: 0 28px; }
  .bar i { width: 18px; height: 18px; border-radius: 50%; margin-right: 11px; display: block; }
  .bar .ti { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; gap: 12px;
    font-size: 22px; font-weight: 600; letter-spacing: -.02em; color: #f4f4f6; }
  .bar .ti img { height: 26px; }
  .card pre { padding: 18px 56px 52px; font-size: 52px; line-height: 1.6; letter-spacing: -.5px; color: #e9e9ee; }
  .card pre .p { color: #8f9cff; }
  .cur { display: inline-block; width: 28px; height: 56px; background: #e9e9ee; vertical-align: -10px; margin-left: 10px; }

  .mosaic { position: absolute; inset: -10px; display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(3, 1fr); gap: 10px; }
  .mosaic div { position: relative; overflow: hidden; border-radius: 14px; }
  .mosaic img { width: 100%; height: 100%; object-fit: cover; }
  .chip { position: absolute; left: 14px; top: 14px; display: flex; gap: 8px; align-items: center; padding: 7px 12px; border-radius: 999px;
    background: rgba(0,0,0,.6); font-size: 14px; color: #fff; backdrop-filter: blur(6px); }
  .shade { position: absolute; inset: 0; z-index: 2; background: radial-gradient(ellipse 46% 52% at 50% 52%, rgba(0,0,0,.92), rgba(0,0,0,.72) 55%, rgba(0,0,0,.35)); }

</style></head><body>
<div class="mosaic" id="mo"></div><div class="shade"></div>
<div class="card">
  <div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i>
    <span class="ti"><img src="../../vendors/respan-dark.svg" alt="">Get started with Respan Gateway</span></div>
<pre class="mono"><span class="p">pip install</span> respan-gateway
<span class="p">respan-gateway</span><span class="cur"></span></pre>
</div>
<script>
  let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  // maker marks: the repo's vendor logos, plus respan.ai's for the rest (dark fill, inverted)
  const MK = { anthropic: '../../vendors/anthropic-dark.svg', openai: '../../vendors/openai-dark.svg', google: '../../vendors/gemini.svg',
    xai: '../../vendors/xai-dark.svg', deepseek: '../../vendors/deepseek.svg', mistral: '../../vendors/mistral.svg',
    qwen: '../logos/qwen.svg', moonshot: '../logos/moonshot.svg', z_ai: '../logos/z_ai.svg', minimax: '../logos/minimax.svg' };
  const INV = { qwen: 'invert(1)', moonshot: 'invert(1)', z_ai: 'invert(1)', minimax: 'brightness(0) invert(.89)' };
  const mark = (m, px) => `<img src="${MK[m]}" style="width:${px}px;height:${px}px;flex:none;filter:${INV[m] || 'none'}">`;
  const MODELS = [['anthropic','claude-opus-5-5'],['openai','gpt-6-luna'],['google','gemini-4-argon'],['deepseek','deepseek-v4.1-flash'],
    ['mistral','mistral-large-3'],['xai','grok-4.7'],['qwen','qwen3.8-max'],['moonshot','kimi-k3'],['anthropic','claude-sonnet-5-5'],
    ['z_ai','glm-5.3'],['openai','gpt-6.1-sol'],['minimax','minimax-m3'],['google','gemini-3.8-flash'],['anthropic','claude-haiku-5-5'],
    ['deepseek','deepseek-v4-pro'],['openai','gpt-6-astra']];
  const PHOTOS = ['p1','p5','p2','p9','p3','p6','p4','p7','p8','p10'];

  // a photo is labeled with an image or video model
  const tags = [['openai','gpt-image-2'],['google','veo-4'],['google','gemini-3-image'],['xai','grok-imagine'],['openai','sora-3'],['minimax','minimax-image'],
    ['google','imagen-5'],['openai','gpt-image-2'],['qwen','qwen-image'],['google','veo-4'],['openai','sora-3'],['xai','grok-imagine'],
    ['google','gemini-3-image'],['minimax','hailuo-3'],['openai','gpt-image-2'],['google','imagen-5'],['qwen','qwen-image'],['google','veo-4']];
  let h = ''; for (let i = 0; i < 18; i++) { const [m, id] = tags[i]; h += `<div><img src="../img/${PHOTOS[i % PHOTOS.length]}.jpg"><span class="chip mono">${mark(m, 16)}${id}</span></div>`; }
  document.getElementById('mo').innerHTML = h;

</script></body></html>
