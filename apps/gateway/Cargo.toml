[package]
name = "respan-gateway"
description = "An LLM gateway with a neutral core and compiled-in plugins."
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["llm", "gateway", "openai", "anthropic", "gemini"]
categories = ["web-programming::http-server", "command-line-utilities"]
# `ui-dist/` is git-ignored: a release copies the built UI there to publish it.
include = ["src/**", "build.rs", "ui-dist/**"]

[lints]
workspace = true

[lib]
name = "respan_gateway"
path = "src/lib.rs"

[[bin]]
name = "respan-gateway"
path = "src/main.rs"

[dependencies]
respan-gateway-tool-vendors.workspace = true
respan-gateway-plugin-mcp-router.workspace = true
parking_lot.workspace = true
base64.workspace = true
form_urlencoded.workspace = true
respan-gateway-http-faults.workspace = true
respan-gateway-plugin-relay.workspace = true
respan-gateway-plugin-credentials.workspace = true
respan-gateway-conversation.workspace = true
respan-gateway-conversation-http.workspace = true
respan-gateway-core.workspace = true
respan-gateway-http.workspace = true
respan-gateway-http-transport.workspace = true
respan-gateway-mcp.workspace = true
respan-gateway-mcp-http.workspace = true
respan-gateway-passthrough-http.workspace = true
respan-gateway-media.workspace = true
respan-gateway-decision.workspace = true
respan-gateway-media-http.workspace = true
respan-gateway-decision-http.workspace = true
respan-gateway-plugin-fallback.workspace = true
respan-gateway-plugin-routing.workspace = true
respan-gateway-plugin-tool-loop.workspace = true
respan-gateway-plugin-respan.workspace = true
respan-gateway-plugin-pricing.workspace = true
respan-gateway-sdk.workspace = true
chrono.workspace = true
csv.workspace = true
moka.workspace = true
bytesize.workspace = true
humantime.workspace = true
serde_path_to_error.workspace = true
respan-gateway-plugin-responses.workspace = true
respan-gateway-vendors.workspace = true
respan-gateway-realtime.workspace = true
respan-gateway-realtime-ws.workspace = true
respan-gateway-ws.workspace = true
respan-gateway-serve.workspace = true
axum.workspace = true
clap = { version = "4.5", features = ["derive", "env"] }
dotenvy = "0.15"
getrandom = { workspace = true, features = ["std"] }
indexmap = { version = "2", features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
terminal_size = "0.4"
toml.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "process", "io-util"] }
tower = { version = "0.5", features = ["util"] }
webbrowser = "1"

[dev-dependencies]
uuid.workspace = true
futures.workspace = true
mockllm = { git = "https://github.com/lihe07/mockllm", rev = "26cf441" }
respan-gateway-eventstream.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "process", "io-util", "time"] }
