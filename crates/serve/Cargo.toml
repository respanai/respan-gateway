[package]
name = "respan-gateway-serve"
description = "Hosting a gateway with Axum: HTTP and WebSocket from one router."
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
respan-gateway-core.workspace = true
respan-gateway-http.workspace = true
respan-gateway-ws.workspace = true
axum.workspace = true
http-body-util.workspace = true
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
tower-layer = "0.3"
tower-service = "0.3"

[dev-dependencies]
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
bytes.workspace = true
futures.workspace = true
respan-gateway-http.workspace = true
tokio = { workspace = true, features = ["macros", "net", "io-util", "rt-multi-thread", "time", "test-util"] }
