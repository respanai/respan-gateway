[package]
name = "respan-gateway-plugin-responses"
description = "The responses plugin: Responses' previous_response_id with any provider, its conversation kept by the gateway."
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
parking_lot.workspace = true
moka.workspace = true
uuid.workspace = true
respan-gateway-conversation.workspace = true
respan-gateway-conversation-http.workspace = true
respan-gateway-core.workspace = true
respan-gateway-http.workspace = true
serde_json.workspace = true
serde = { workspace = true, optional = true }

[features]
# `Serialize` and `Deserialize` for a kept `Turn`, for a store several gateways share.
serde = ["dep:serde", "respan-gateway-conversation/serde"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
