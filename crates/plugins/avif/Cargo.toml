[package]
name = "respan-gateway-plugin-avif"
description = "First-party plugin: AVIF images in a decision request become PNG, for a provider that cannot read AVIF."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
respan-gateway-core.workspace = true
respan-gateway-decision.workspace = true
base64.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt"] }
libc = "0.2"
png = "0.18"
# The Rust port of dav1d, without its assembly: no nasm, no C toolchain.
rav1d = { version = "1.1", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }

[dev-dependencies]
respan-gateway-decision-http.workspace = true
respan-gateway-http.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
