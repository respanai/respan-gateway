[package]
name = "respan-gateway-plugin-tool-loop"
description = "First-party plugin: the gateway runs tools inside a chat request."
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
wildmatch.workspace = true
parking_lot.workspace = true
respan-gateway-http-faults.workspace = true
respan-gateway-core.workspace = true
respan-gateway-conversation.workspace = true
respan-gateway-http.workspace = true
respan-gateway-realtime.workspace = true
respan-gateway-realtime-ws.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time", "macros"] }

[dev-dependencies]
respan-gateway-http.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "test-util"] }
